name: Validate Luggage
on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches-ignore: [main]
    paths: ['worker/**', '.github/workflows/validate.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v6
        with:
          # Staged integration exports the immutable staff parent from Git.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Typecheck customer browser client
        run: pnpm exec tsc -p tsconfig.customer-client.json --noEmit
      - run: pnpm test
      - name: Test customer intake and ownership boundaries
        run: node scripts/test-customer-intake.mjs
      - name: Test staff-first customer upgrade on isolated D1 and R2
        run: node --test tests/staffCustomerIntegration.test.mjs
      - run: pnpm run check:customer-assets
